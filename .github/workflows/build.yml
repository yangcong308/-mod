name: Build Mod

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build mod
        run: ./gradlew build
        env:
          GRADLE_OPTS: "-Dgradle.wrapperUrl=https://mirrors.cloud.tencent.com/maven/gradle/gradle-8.12-bin.zip"

      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
